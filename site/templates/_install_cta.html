<aside class="cta-box" aria-label="{{ t.install_cta.title|a }}">
  <div class="cta-box__text">
    <p class="cta-box__title">{{ t.install_cta.title }}</p>
    <p>{{ t.install_cta.text }}</p>
    <div class="btn-row">
      <a class="btn btn--primary" href="{{ prefix }}#install"><svg class="i" aria-hidden="true"><use href="{{ icons }}#i-arrow-right"></use></svg>{{ t.install_cta.button }}</a>
      <a class="link-arrow" href="{{ prefix }}#ai">{{ t.install_cta.ai }}</a>
    </div>
  </div>
  <img src="/assets/img/mags-cheer.webp" width="346" height="400" alt="" loading="lazy">
</aside>
