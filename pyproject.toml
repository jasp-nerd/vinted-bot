[project]
name = "vinted-bot"
version = "2.1.0"
description = "Free, self-hosted Vinted bot and monitor: alerts for new Vinted listings on Discord, Telegram, ntfy or email, with a web dashboard. No login, no subscription."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "vinted-bot contributors" }]
keywords = [
    "vinted", "vinted-bot", "vinted-monitor", "vinted-alerts", "vinted-notifications",
    "vinted-scraper", "vinted-api", "second-hand", "monitor", "notifier", "discord", "telegram",
    "ntfy", "self-hosted",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Natural Language :: French",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Office/Business",
]
dependencies = [
    "httpx[brotli,zstd]>=0.28",
    "aiosqlite>=0.20",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "structlog>=25.1",
    "aiogram>=3.17",
    # zoneinfo needs a time zone database; Windows and slim containers have none.
    "tzdata>=2025.2",
    # Where the database goes outside a container: the platform's per-user data folder.
    "platformdirs>=4.3",
    # The dashboard is on by default, so its server is a core dependency, not an extra.
    # python-multipart is what lets FastAPI read the dashboard's form posts.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
# TLS impersonation, only needed if plain httpx starts getting blocked.
# Kept optional because curl_cffi ships compiled wheels that complicate ARM installs.
impersonate = ["curl_cffi>=0.7"]
# Apprise reaches the long tail of services (email, Slack, Pushover, Gotify, Matrix, Signal,
# Home Assistant...) through one URL each. Optional: it pulls in requests and friends.
apprise = ["apprise>=2.1"]

[project.scripts]
vinted-bot = "vinted_bot.cli:main"

[project.urls]
Homepage = "https://vinted-bot.jaspnerd.dev"
Source = "https://github.com/jasp-nerd/vinted-bot"
Documentation = "https://github.com/jasp-nerd/vinted-bot/tree/main/docs"
Changelog = "https://github.com/jasp-nerd/vinted-bot/blob/main/CHANGELOG.md"
Issues = "https://github.com/jasp-nerd/vinted-bot/issues"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "coverage[toml]>=7.6",
    "ruff>=0.9",
    "mypy>=1.14",
    "deptry>=0.21",
    "vulture>=2.14",
    "httpx2>=2.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The source archive is for building and testing the package; the landing site, deploy
# templates, screenshots and demo tooling live in the repository only.
[tool.hatch.build.targets.sdist]
exclude = ["/site", "/deploy", "/docs/media", "/scripts", "/.github"]

[tool.hatch.build.targets.wheel]
packages = ["src/vinted_bot"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "ASYNC",     # async correctness (blocking calls in coroutines)
    "BLE",       # blind except
    "ARG",       # unused arguments
    "ERA",       # commented-out code
    "C90",       # mccabe complexity
    "PL",        # pylint subset
    "RUF",
]
ignore = [
    "PLR0913",  # many arguments: senders and builders legitimately take several
]

[tool.ruff.lint.per-file-ignores]
# Tests may use assert-heavy, longer, less-abstract code.
"tests/**" = ["PLR2004", "ARG001", "ARG002"]
# The landing site's build scripts are one-off tooling, not the package: build.py re-runs
# itself through uv before its imports (E402), and page-building code is long and literal.
"site/**" = ["B007", "PLC0415", "PLR0911", "E402", "E501", "E741", "PLR2004", "B905", "PLW1510", "PLW0603", "PLR0912", "PLR0915", "PLR0917", "C901", "RUF005"]
# A route table and a command table are long and branchy by nature. Splitting them to
# satisfy a complexity metric would scatter related handlers across files for no gain.
"src/vinted_bot/web/server.py" = ["C901", "PLR0915", "PLR0917", "PLR0913"]
"src/vinted_bot/cli.py" = ["C901", "PLR0911", "PLR0912"]
# One send attempt has several distinct outcomes — delivered, paused, gone, retry, gave
# up — and each needs its own early exit. Splitting them would hide the flow, not clarify it.
"src/vinted_bot/deliver/dispatcher.py" = ["C901", "PLR0911"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
warn_unreachable = true
enable_error_code = ["redundant-expr", "possibly-undefined", "truthy-bool"]

[[tool.mypy.overrides]]
module = ["curl_cffi.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/vinted_bot"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.deptry]
known_first_party = ["vinted_bot"]

[tool.deptry.per_rule_ignores]
# curl_cffi and apprise are imported lazily behind config flags; python-multipart and jinja2 are loaded
# by FastAPI and Starlette, and tzdata by zoneinfo, never imported by name.
DEP002 = ["tzdata", "curl_cffi", "apprise", "python-multipart", "jinja2"]

[tool.vulture]
min_confidence = 80
paths = ["src"]
# Required by the context-manager protocol whether or not we look at them.
ignore_names = ["exc_type", "exc", "tb"]
