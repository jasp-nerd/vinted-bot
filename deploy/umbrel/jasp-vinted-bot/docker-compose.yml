services:
  app_proxy:
    environment:
      # <app-id>_<service-name>_1
      APP_HOST: jasp-vinted-bot_web_1
      APP_PORT: 8000

  web:
    # Pin the release tag and its digest here when publishing to the store, so every
    # Umbrel runs the version that was tested:
    #   docker buildx imagetools inspect ghcr.io/jasp-nerd/vinted-bot:2.1.0
    image: ghcr.io/jasp-nerd/vinted-bot:2.1.0
    restart: on-failure
    stop_grace_period: 30s
    environment:
      # Umbrel's app folders belong to 1000:1000; the image hands /data to this user and
      # runs as it.
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Paris
      # Umbrel passes the name the browser used through to the app, and the dashboard only
      # answers to names it knows (that is what stops DNS rebinding). Umbrel provides both
      # of the device's names; the public URL also becomes the Dashboard link in alerts.
      VINTED_BOT_WEB_ALLOWED_HOSTS: "${DEVICE_DOMAIN_NAME},${DEVICE_HOSTNAME}"
      VINTED_BOT_WEB_PUBLIC_URL: "http://${DEVICE_DOMAIN_NAME}:${APP_PROXY_PORT}"
    volumes:
      - ${APP_DATA_DIR}/data:/data
