# documentation: https://github.com/jasp-nerd/vinted-bot
# slogan: Alerts on Discord, Telegram and more when a new Vinted listing matches your search.
# category: monitoring
# tags: vinted, alerts, notifications, discord, telegram, secondhand
# logo: svgs/vinted-bot.png
# port: 8000

# Coolify one-click template. Paste it as a Docker Compose resource in Coolify, or submit it
# to coollabsio/coolify under templates/compose/ (with the icon in svgs/).

services:
  vinted-bot:
    image: ghcr.io/jasp-nerd/vinted-bot:latest
    volumes:
      - vinted-bot-data:/data
    environment:
      - SERVICE_URL_VINTEDBOT_8000
      - VINTED_BOT_WEB_PUBLIC_URL=${SERVICE_URL_VINTEDBOT}
      # The dashboard gets a public address here, so it gets a password. Coolify generates
      # one and shows it under Environment Variables.
      - VINTED_BOT_WEB_AUTH_TOKEN=${SERVICE_PASSWORD_64_DASHBOARD}
      - TZ=${TZ:-Europe/Paris}
    healthcheck:
      test: ["CMD", "vinted-bot", "heartbeat"]
      interval: 60s
      timeout: 10s
      start_period: 45s
      retries: 3
