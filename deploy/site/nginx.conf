# nginx for https://vinted-sniper.jaspnerd.dev, serving the output of `python3 site/build.py`
# (site/dist/). Traefik in front terminates TLS and redirects http to https.
#
# add_header only inherits into a location that sets none of its own, so the security headers
# are repeated in every location that adds a Cache-Control.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Redirects stay relative ("Location: /fr/"), so they keep the https the visitor came in on
    # instead of nginx building an http:// URL from its own port.
    absolute_redirect off;
    port_in_redirect off;

    charset utf-8;
    charset_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    # One URL per page: /index.html and /fr/index.html go to / and /fr/. $request_uri is what
    # the visitor asked for, so the internal index lookup can't loop through this.
    if ($request_uri ~ "^(?<dir>.*/)index\.html(?<query>\?.*)?$") {
        return 301 $dir$query;
    }

    error_page 404 /404.html;

    # Pages. A directory asked for without its slash (/fr) gets a 301 to /fr/ from nginx itself.
    location / {
        add_header Cache-Control "public, max-age=3600" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Each language gets its own "not found" page.
    location ~ "^/(?<lang>fr|de|it|es|pl|nl)/" {
        error_page 404 /$lang/404.html;
        add_header Cache-Control "public, max-age=3600" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # CSS, JS, fonts and the icon sprite carry a content hash in their name (site.3f2a9c01d4.css),
    # so a new version is a new URL and the old one can be cached for good.
    location ~ "^/assets/.+\.[0-9a-f]{10}\.(css|js|svg|woff2)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Install scripts, llms.txt, robots.txt and the IndexNow key read as text in a browser.
    location ~* "\.(sh|ps1|txt)$" {
        types { }
        default_type text/plain;
        add_header Cache-Control "public, max-age=300" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Images and other assets without a hash in their name (the app links to /assets/demo/).
    location /assets/ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }
}
