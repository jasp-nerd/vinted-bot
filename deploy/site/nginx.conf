server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml application/json;
    error_page 404 /404.html;
    location ~* \.(sh|ps1|txt)$ { default_type text/plain; charset utf-8; types { } }
    location /assets/ { expires 7d; add_header Cache-Control "public"; }
    location / { try_files $uri $uri/ =404; }
}
