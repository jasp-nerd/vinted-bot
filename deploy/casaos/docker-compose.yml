# vinted-bot for CasaOS and ZimaOS. In the CasaOS dashboard: App Store, Custom Install,
# then the import button, and paste this file. The same file is the starting point for a
# pull request to a community store such as BigBear's (Apps/vinted-bot/).
name: vinted-bot
services:
  app:
    image: ghcr.io/jasp-nerd/vinted-bot:latest
    container_name: vinted-bot
    restart: unless-stopped
    environment:
      # CasaOS app folders usually belong to 1000:1000.
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Paris
      # The dashboard password. CasaOS opens the app from other devices on your network,
      # and the dashboard shows your alert links, so it never runs without one here.
      # Replace this example with any long random text before installing (the install
      # dialog shows it under Environment variables). You type it once per browser.
      VINTED_BOT_WEB_AUTH_TOKEN: "change-this-to-something-long-and-random"
    volumes:
      - /DATA/AppData/$AppID:/data
    ports:
      - "8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Time zone, for example Europe/Paris
        - container: VINTED_BOT_WEB_AUTH_TOKEN
          description:
            en_US: Dashboard password. Change it to something long and random
      volumes:
        - container: /data
          description:
            en_US: Your searches and alert settings
      ports:
        - container: "8000"
          description:
            en_US: Dashboard
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  author: jasp-nerd
  developer: jasp-nerd
  category: Utilities
  icon: https://raw.githubusercontent.com/jasp-nerd/vinted-bot/main/docs/media/icon.png
  title:
    en_US: vinted-bot
  tagline:
    en_US: Alerts for new Vinted listings
  description:
    en_US: Get a message on Telegram, Discord or another app the moment a new Vinted listing matches your search. Never logs in to Vinted. Not affiliated with Vinted.
  port_map: "8000"
  scheme: http
  index: /
