name: Installers

# Runs install.sh and install.ps1 for real on fresh machines, against the code in this
# checkout rather than what is published, so a change that breaks an installer fails here
# instead of on someone's laptop.
on:
  push:
    branches: [main]
    paths: ["install.sh", "install.ps1", "pyproject.toml", ".github/workflows/installers.yml"]
  pull_request:
    paths: ["install.sh", "install.ps1", "pyproject.toml", ".github/workflows/installers.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      VINTED_SNIPER_KEEP_AWAKE: "no"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job here pushes, so the token has no reason to stay in .git/config.
          persist-credentials: false

      - name: Lint
        if: runner.os == 'Linux'
        run: |
          pipx run --spec shellcheck-py shellcheck -s sh install.sh docker/entrypoint.sh

      - name: Install
        run: |
          export VINTED_SNIPER_PACKAGE="vinted-sniper[web] @ file://$GITHUB_WORKSPACE"
          sh install.sh --no-autostart --no-browser

      - name: Check it runs
        run: |
          curl -sS --max-time 5 http://localhost:8000/healthz | grep '"alive"'
          "$HOME/.local/bin/vinted-sniper" --version

      - name: Run it again, as an update would
        run: |
          export VINTED_SNIPER_PACKAGE="vinted-sniper[web] @ file://$GITHUB_WORKSPACE"
          sh install.sh --no-autostart --no-browser
          curl -sS --max-time 5 http://localhost:8000/healthz | grep '"alive"'

      - name: Uninstall
        run: |
          sh install.sh --uninstall
          sleep 3
          if [ -e "$HOME/.local/bin/vinted-sniper" ]; then echo "still installed"; exit 1; fi
          if curl -s --max-time 2 http://localhost:8000/healthz; then echo "still running"; exit 1; fi

  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Windows PowerShell 5.1 on purpose: it is what a fresh Windows has.
      - name: Install
        shell: powershell
        run: |
          $env:VINTED_SNIPER_PACKAGE = 'vinted-sniper[web] @ file:///' + ($env:GITHUB_WORKSPACE -replace '\\', '/')
          powershell -NoProfile -NonInteractive -ExecutionPolicy ByPass -File install.ps1 -NoAutostart -NoBrowser

      - name: Check it runs
        shell: powershell
        run: |
          $response = Invoke-WebRequest -UseBasicParsing -Uri http://localhost:8000/healthz -TimeoutSec 5
          if ($response.Content -notmatch '"alive"') { throw "unexpected answer: $($response.Content)" }
          & "$env:USERPROFILE\.local\bin\vinted-sniper.exe" --version

      - name: Install through irm | iex, as an update would
        shell: powershell
        run: |
          $env:VINTED_SNIPER_PACKAGE = 'vinted-sniper[web] @ file:///' + ($env:GITHUB_WORKSPACE -replace '\\', '/')
          $env:VINTED_SNIPER_AUTOSTART = 'no'
          $env:VINTED_SNIPER_NO_BROWSER = '1'
          Get-Content -Raw install.ps1 | Invoke-Expression
          $response = Invoke-WebRequest -UseBasicParsing -Uri http://localhost:8000/healthz -TimeoutSec 5
          if ($response.Content -notmatch '"alive"') { throw "unexpected answer: $($response.Content)" }

      - name: Uninstall
        shell: powershell
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy ByPass -File install.ps1 -Uninstall
          Start-Sleep -Seconds 3
          if (Test-Path "$env:USERPROFILE\.local\bin\vinted-sniper.exe") { throw 'still installed' }
          if (Get-Process vinted-sniper -ErrorAction SilentlyContinue) { throw 'still running' }
