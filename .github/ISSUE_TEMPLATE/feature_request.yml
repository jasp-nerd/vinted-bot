name: Idea or feature request
description: Something vinted-bot could do better.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation and what gets in the way. This matters more than the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine it working, if you have an idea.
  - type: textarea
    id: else
    attributes:
      label: Anything else?
      description: Other tools that do this well, screenshots, the Vinted site you use.
