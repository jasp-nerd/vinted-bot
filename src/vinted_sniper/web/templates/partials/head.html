{# A theme chosen on this device wins over the saved one, applied before first paint. #}
<script>try{var t=localStorage.getItem("vs-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;else if(t==="system")delete document.documentElement.dataset.theme}catch(e){}</script>
