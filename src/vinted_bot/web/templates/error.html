{% extends "base.html" if app else "bare.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<section class="field-panel field-panel--rose empty" aria-labelledby="err-title" style="margin-top:12px">
  <div class="empty__text">
    <h1 class="t-h1" id="err-title">{{ title }}</h1>
    <p class="t-lead">{{ message }}</p>
    {% if not no_way_back %}<div class="btn-row"><a class="btn btn--primary" href="/">Back to your finds</a></div>{% endif %}
  </div>
  {{ ui.mags("worried", "empty__art") }}
</section>
{% endblock %}
